[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="lr-payload-lab"
version="0.1.0"
description="Build bounded, auditable benign payloads for endpoint telemetry and detection research"
requires-python=">=3.10"
[project.scripts]
payload-lab="payload_lab.cli:main"
[tool.setuptools.packages.find]
where=["src"]
