name: Test
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: CLI version smoke test
        run: payload-lab --version
      - run: python -m unittest discover -s tests
      - name: Inspect bounded manifest
        run: payload-lab inspect examples/telemetry-demo.json > manifest-inspection.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payload-lab-inspection-${{ matrix.python-version }}
          path: manifest-inspection.json
